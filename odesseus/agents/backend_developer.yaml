---
name: "BackendDeveloper"
role: >
  Разрабатывает бэкенд Candels по траектории В: Django REST Framework, JWT,
  Django Channels (WebSocket), API для каталога свечей, корзины и заказов.
project_root: "C:/Users/vacba/Desktop/Candels"
docker_workspace: "/workspace/candels"
trajectory: "V"

skills:
  - type: api_call
    config:
      base_url: "http://127.0.0.1:8000"
      prefix: "/api"
      endpoints:
        - "GET /api/categories/"
        - "GET /api/products/"
        - "POST /api/auth/login/"
        - "POST /api/auth/token/refresh/"
        - "GET /api/orders/"
        - "POST /api/orders/"
      timeout: 30

  - type: json_parse
    config:
      validate_schema: true
      schemas_dir: "docs/openapi"

  - type: custom_python
    config:
      script: "odesseus/skills/django_rest_api.py"
      description: "DRF ViewSet, Serializer, permissions для catalog/orders/accounts"

  - type: custom_python
    config:
      script: "odesseus/skills/jwt_auth.py"
      description: "JWT access/refresh, SimpleJWT, эндпоинты /api/auth/*"

  - type: custom_python
    config:
      script: "odesseus/skills/websocket_channels.py"
      description: "Django Channels: real-time статусы заказов и комментарии"

  - type: custom_python
    config:
      script: "odesseus/skills/django_migrations.py"
      description: "Миграции моделей Category, Product, Order, OrderItem, User"

config:
  stack:
    language: "python"
    framework: "django"
    api: "djangorestframework"
    auth: "djangorestframework-simplejwt"
    websocket: "channels"
    database: "postgresql"
  apps:
    - "apps.accounts"
    - "apps.catalog"
    - "apps.cart"
    - "apps.orders"
  deliverables:
    - "REST API 10+ эндпоинтов"
    - "JWT auth (register/login/refresh/profile)"
    - "WebSocket ws/orders/<id>/"
    - "Permissions: guest / user / admin"
  reference_docs: "Desktop/МУ_КП_ТРПО.pdf — траектория В, этапы 4-6"

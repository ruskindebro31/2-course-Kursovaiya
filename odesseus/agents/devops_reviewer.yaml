---
name: "DevOpsReviewer"
role: >
  Проверяющий/DevOps: ревью кода, Docker, docker-compose, CI, безопасность,
  CORS, .env, готовность к развёртыванию Candels (Django + React + Redis + PostgreSQL).
project_root: "C:/Users/vacba/Desktop/Candels"
docker_workspace: "/workspace/candels"
trajectory: "V"

skills:
  - type: json_parse
    config:
      compare_schemas: true
      validate_docker_compose: true

  - type: custom_python
    config:
      script: "odesseus/skills/code_review.py"
      description: "Структурированный code review бэкенда и фронтенда"

  - type: custom_python
    config:
      script: "odesseus/skills/security_check.py"
      description: "JWT, CORS, SECRET_KEY, XSS, SQL injection"

  - type: custom_python
    config:
      script: "odesseus/skills/docker_compose_check.py"
      description: "Проверка Dockerfile, docker-compose, Redis Channel Layers"

  - type: custom_python
    config:
      script: "odesseus/skills/deployment_checklist.py"
      description: "Чеклист развёртывания по МУ траектории В"

config:
  review_criteria:
    - "architecture_trajectory_v"
    - "docker_compose_valid"
    - "env_secrets_not_committed"
    - "cors_configured"
    - "websocket_redis_ready"
    - "api_documentation_openapi"
    - "git_statistics_in_readme"
  severity_levels: ["critical", "major", "minor", "suggestion"]
  approval_threshold: "no_critical_issues"
  required_files:
    - "docker-compose.yml"
    - "Dockerfile"
    - "frontend/Dockerfile"
    - ".env.example"
    - "requirements.txt"

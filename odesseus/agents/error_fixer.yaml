---
name: "ErrorFixer"
role: >
  Исправляет независимые ошибки: 404 маршруты, битые ссылки, отсутствующие
  static/media, CORS, неверные URL patterns, пустые redirects в catalog/urls.py.
project_root: "C:/Users/vacba/Desktop/Candels"
docker_workspace: "/workspace/candels"
trajectory: "V"

skills:
  - type: api_call
    config:
      base_url: "http://127.0.0.1:8000"
      scan_routes: true
      expected_codes: [200, 201, 301, 302, 401, 403]
      flag_codes: [404, 500, 502, 503]

  - type: custom_python
    config:
      script: "odesseus/skills/scan_404.py"
      description: "Сканирует URL-паттерны Django и React Router на 404"

  - type: custom_python
    config:
      script: "odesseus/skills/fix_routes.py"
      description: "Чинит urls.py, redirects, include(), name= reverse()"

  - type: custom_python
    config:
      script: "odesseus/skills/fix_static_media.py"
      description: "STATIC_URL, MEDIA_URL, missing files, collectstatic"

  - type: custom_python
    config:
      script: "odesseus/skills/fix_cors_csrf.py"
      description: "CORS_ALLOWED_ORIGINS, CSRF_TRUSTED_ORIGINS для React"

  - type: custom_python
    config:
      script: "odesseus/skills/fix_known_candels_issues.py"
      description: "Известные баги Candels: корзина после заказа, catalog redirects"

config:
  auto_fix:
    - "404_missing_routes"
    - "broken_static_links"
    - "cors_preflight_fail"
    - "catalog_redirect_loops"
    - "empty_reverse_name"
  known_issues_file: "PROJECT_PROBLEMS.md"
  scan_paths:
    - "config/urls.py"
    - "apps/*/urls.py"
    - "frontend/src/routes/"
    - "templates/"
